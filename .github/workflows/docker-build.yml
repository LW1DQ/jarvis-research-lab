name: Docker Build NS-3

on:
  push:
    branches: [main]
    paths:
      - 'docker/Dockerfile.ns3'
      - 'docker/docker-entrypoint.sh'
  pull_request:
    branches: [main]
    paths:
      - 'docker/Dockerfile.ns3'
      - 'docker/docker-entrypoint.sh'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build NS-3 Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.ns3
          push: false
          tags: ns3-simulation:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test image (basic)
        run: |
          docker run --rm ns3-simulation:latest python3 -c "
          import sys
          print('Python:', sys.version)
          import numpy, pandas, scipy, matplotlib
          print('Core packages OK')
          "